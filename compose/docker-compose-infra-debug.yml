# Debug Infrastructure - Ports exposed to host
# Usage: docker compose -f docker-compose-infra-debug.yml up -d

services:
  blade-postgresql:
    image: postgres:16
    container_name: blade_postgresql_debug
    restart: always
    shm_size: '8gb'
    environment:
      POSTGRES_DB: tpl_data
      POSTGRES_USER: tpl_data
      POSTGRES_PASSWORD: tpl_data
    command: >
      postgres
      -c max_connections=500
      -c shared_buffers=2GB
      -c work_mem=32MB
    ports:
      - "5466:5432"
    volumes:
      - ./blade_containers_data/debug/postgresql_data:/var/lib/postgresql/data
    networks:
      - blade-network-debug

  blade-redis:
    image: redis:latest
    container_name: blade_redis_debug
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6366:6379"
    volumes:
      - ./blade_containers_data/debug/redis_data:/data
    networks:
      - blade-network-debug

  blade-minio:
    image: minio/minio:latest
    container_name: blade_minio_debug
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./blade_containers_data/debug/minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s
    networks:
      - blade-network-debug

  blade-minio-client:
    image: minio/mc:latest
    container_name: blade_minio_client_debug
    depends_on:
      blade-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://blade-minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO...'
        sleep 3
      done &&
      mc mb myminio/input-files --ignore-existing &&
      mc mb myminio/output-files --ignore-existing &&
      mc anonymous set public myminio/input-files &&
      mc anonymous set public myminio/output-files &&
      echo 'MinIO buckets created successfully' &&
      exit 0;
      "
    networks:
      - blade-network-debug

networks:
  blade-network-debug:
    name: blade-network-debug
    driver: bridge
