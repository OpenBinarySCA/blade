# Production Infrastructure - No ports exposed
# Usage: docker compose -f docker-compose-infra-prod.yml up -d

services:
  blade-postgresql:
    image: postgres:16
    container_name: blade_postgresql_prod
    restart: always
    environment:
      POSTGRES_DB: tpl_data
      POSTGRES_USER: tpl_data
      POSTGRES_PASSWORD: tpl_data
    volumes:
      - ./blade_containers_data/prod/postgresql_data:/var/lib/postgresql/data
    networks:
      - blade-network-prod

  blade-redis:
    image: redis:latest
    container_name: blade_redis_prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - ./blade_containers_data/prod/redis_data:/data
    networks:
      - blade-network-prod

  blade-minio:
    image: minio/minio:latest
    container_name: blade_minio_prod
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./blade_containers_data/prod/minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s
    networks:
      - blade-network-prod

  blade-minio-client:
    image: minio/mc:latest
    container_name: blade_minio_client_prod
    depends_on:
      blade-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://blade-minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO...'
        sleep 3
      done &&
      mc mb myminio/input-files --ignore-existing &&
      mc mb myminio/output-files --ignore-existing &&
      mc anonymous set public myminio/input-files &&
      mc anonymous set public myminio/output-files &&
      echo 'MinIO buckets created successfully' &&
      exit 0;
      "
    networks:
      - blade-network-prod

networks:
  blade-network-prod:
    name: blade-network-prod
    driver: bridge
